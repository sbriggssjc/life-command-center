name: Build Brief Collector

# XB1 — docs/architecture/EXEC-BRIEFS-SPEC.md §5,
# prompts/XB1-XB2-build-brief-collector-and-audit-rules.md. Runs the deterministic collector
# (scripts/build-brief-collector.mjs) on every push to `main` and nightly, writing one row into
# `build_brief_snapshots` (EB1). NO dashboard here (#/exec is XB3), NO Ollama narrative (XB4) —
# per the CLAUDE.md "a NEW CI job is not shipped until it has been green once on `main`" doctrine
# and the "a surface with nothing behind it" lesson this program keeps re-learning, this workflow
# ONLY runs the collector; it does not gate anything and never fails the run on a finding — a
# finding is data for the brief, not a build failure. It DOES fail if the collector itself errors
# (a real defect in the collector, distinct from what the collector reports).
#
# Required secrets (Settings → Environments → Production), same convention as daily-db-checks.yml:
#   LCC_SUPABASE_URL / LCC_SERVICE_ROLE_KEY
#
# DEPLOY2-coverage (2026-09-16) added a SECOND project to the `migration_unapplied` rule:
# `supabase/migrations/dialysis/` targets Dialysis_DB, so its declared objects are probed there.
#   DIA_SUPABASE_URL            — already present on Production
#   DIA_SUPABASE_SERVICE_KEY    — NOT set today; passed anyway so the rule upgrades itself the day
#                                 it is (the resolver prefers it)
#   DIA_SUPABASE_KEY            — present; the anon JWT today, per GitHub issue #720
# BOTH dia key names are passed because `api/_shared/supabase-keys.js::diaSupabaseKey()` picks
# between them. Passing both is what makes the #720 Phase 4 upgrade automatic with no second
# workflow change.
#
# ⚠️ The dia pair is deliberately NOT a hard-fail precondition. The LCC half must still run when
# the dia credentials are absent — and when they are, the dia files emit a `skipped` finding with
# the reason on them rather than quietly reducing to "root only, all clean" (B6a: a skipped step
# must EMIT, not vanish).

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 11 * * *'   # 11:30 UTC nightly — after the market-brief feed-health check (11:15)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Run the build-brief collector
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needs full history + all remote branch refs for the branch-debt rule

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run collector (writes one build_brief_snapshots row)
        env:
          LCC_SUPABASE_URL: ${{ secrets.LCC_SUPABASE_URL }}
          LCC_SERVICE_ROLE_KEY: ${{ secrets.LCC_SERVICE_ROLE_KEY }}
          DIA_SUPABASE_URL: ${{ secrets.DIA_SUPABASE_URL }}
          DIA_SUPABASE_SERVICE_KEY: ${{ secrets.DIA_SUPABASE_SERVICE_KEY }}
          DIA_SUPABASE_KEY: ${{ secrets.DIA_SUPABASE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${LCC_SUPABASE_URL:-}" || -z "${LCC_SERVICE_ROLE_KEY:-}" ]]; then
            echo "::error::LCC_SUPABASE_URL / LCC_SERVICE_ROLE_KEY not set (Settings -> Environments -> Production)"
            exit 1
          fi
          # Warn, never fail: the dia half is additive. Its absence is reported ON the snapshot as a
          # per-file `skipped` finding, so the brief can never read clean over an unprobed project.
          if [[ -z "${DIA_SUPABASE_URL:-}" || ( -z "${DIA_SUPABASE_SERVICE_KEY:-}" && -z "${DIA_SUPABASE_KEY:-}" ) ]]; then
            echo "::warning::DIA_SUPABASE_URL / DIA_SUPABASE_*_KEY not set — dialysis/ migrations will be reported UNVERIFIABLE (skipped), not clean"
          fi
          node scripts/build-brief-collector.mjs --write
