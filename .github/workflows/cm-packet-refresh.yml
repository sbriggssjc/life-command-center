name: CM packet refresh

# Rebuilds the Capital Markets frozen packet OFF the user request path, so the
# in-app display + workbook export pick up fresh data (e.g. a new quarter) without
# a slow, degradation-prone request-time rebuild. Safe by construction: the server
# regression guard (buildOrFetchPacket) rejects any rebuild that would drop/empty a
# chart, so a bad build never clobbers the good frozen snapshot — the loop just
# retries until a complete build lands.
#
# Requires two repo secrets (honest no-op if unset):
#   LCC_APP_URL — base URL of the deployed app, e.g. https://briggscrelccopps.com
#   LCC_APP_KEY — the LCC_API_KEY value (sent as X-LCC-Key)

on:
  schedule:
    # Daily 09:10 UTC — after the gov master_m mat refresh cron (08:40 UTC).
    - cron: '10 9 * * *'
  workflow_dispatch:
    inputs:
      vertical:
        description: Vertical to refresh (gov | dialysis)
        required: false
        default: gov
      attempts:
        description: Max refresh attempts
        required: false
        default: '6'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh CM packet
        env:
          LCC_APP_URL: ${{ secrets.LCC_APP_URL }}
          LCC_APP_KEY: ${{ secrets.LCC_APP_KEY }}
          VERTICAL: ${{ github.event.inputs.vertical || 'gov' }}
          MAX_ATTEMPTS: ${{ github.event.inputs.attempts || '6' }}
        run: |
          set -euo pipefail
          if [ -z "${LCC_APP_URL:-}" ] || [ -z "${LCC_APP_KEY:-}" ]; then
            echo "LCC_APP_URL / LCC_APP_KEY not set — skipping (honest no-op)."
            exit 0
          fi
          url="${LCC_APP_URL%/}/api/capital-markets?action=refresh_packet&vertical=${VERTICAL}&attempts=1"
          ok=0
          for i in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "Attempt $i/${MAX_ATTEMPTS} → $url"
            resp=$(curl -sS --max-time 300 -X POST "$url" \
              -H "X-LCC-Key: ${LCC_APP_KEY}" -H 'Content-Type: application/json' || echo '{}')
            echo "$resp" | jq -c '{persisted, regressed, populated_charts, total_charts}' || echo "$resp"
            persisted=$(echo "$resp" | jq -r '.persisted // false')
            regressed=$(echo "$resp" | jq -r '(.regressed // []) | length')
            if [ "$persisted" = "true" ] && [ "$regressed" = "0" ]; then
              echo "Complete packet persisted."
              ok=1
              break
            fi
            echo "Not yet complete (persisted=$persisted regressed=$regressed) — retrying after 20s."
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::CM packet refresh did not land a complete build for ${VERTICAL}; existing snapshot preserved (regression guard)."
          fi
