# GPT's tool set can never drift and never trips the 30-op cap:
#     https://tranquil-delight-production-633f.up.railway.app/api/gpt-spec
#   (equivalently https://tranquil-delight-production-633f.up.railway.app/api/copilot-spec?surface=chatgpt)
