openapi: 3.1.0
info:
  title: Life Command Center — ChatGPT Tools
  version: 1.0.0
  description: >-
    Curated, user-facing subset of the Life Command Center HTTP surface for a ChatGPT custom GPT Action. Every operation
    is a live, Bearer-authenticated route that runs the SAME shared engine as the Claude MCP tool of the same name. Read
    tools are size-bounded; the Salesforce write tools require user_confirmed. Cap rates are decimals (0.0745 = 7.45%).
    Intentionally the user-facing subset — internal pipeline/ingest/merge/cron actions are on the Copilot spec at
    /api/copilot-spec.
servers:
  - url: https://tranquil-delight-production-633f.up.railway.app
    description: Production (tranquil-delight)
paths:
  /api/search-entities:
    post:
      operationId: searchEntities
      summary: Search properties, contacts, or organizations in LCC
      description: >-
        Search the LCC entity graph by name, address, or keyword. For an organization/person match also returns the
        deals where it is the tenant or guarantor.
      tags:
        - read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: Name, address, or keyword to search
                entity_type:
                  type: string
                  enum:
                    - person
                    - organization
                    - asset
                  description: Optional filter by entity type
                domain:
                  type: string
                  enum:
                    - government
                    - dialysis
                    - both
                  description: Optional domain filter
                limit:
                  type: number
                  description: Max results to return
              required:
                - query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/property-context:
    post:
      operationId: getPropertyContext
      summary: Full context for a specific property
      description: >-
        Lease details, ownership history, comps, investment score, research status, related contacts, and the property's
        tenant(s) + guarantor(s). Pass verbose:true for full detail (responses are size-bounded).
      tags:
        - read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_id:
                  type: string
                  description: LCC entity UUID
                property_id:
                  type: string
                  description: Domain properties.property_id; pair with domain when known
                domain:
                  type: string
                  enum:
                    - dia
                    - dialysis
                    - gov
                    - government
                  description: Domain for property_id identity resolution
                address:
                  type: string
                  description: Property address (alternative to entity_id)
                query:
                  type: string
                  description: Free-text property reference (address, name, or "domain:id")
                verbose:
                  type: boolean
                  description: Return full (un-shrunk) detail
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  truncated:
                    type: boolean
  /api/contact-context:
    post:
      operationId: getContactContext
      summary: Relationship context for a contact
      description: Touchpoint history, active deals, last interaction, and outreach recommendations for a contact.
      tags:
        - read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_id:
                  type: string
                  description: LCC entity UUID
                name:
                  type: string
                  description: Contact name (alternative to entity_id)
                email:
                  type: string
                  description: Email address (alternative to entity_id)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
  /api/daily-briefing:
    post:
      operationId: getDailyBriefing
      summary: Today's strategic, important, and urgent priorities
      description: >-
        Get today's strategic, important, and urgent priorities for the team — live market numbers and the ranked
        priority queue, not a from-memory description.
      tags:
        - read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace_id:
                  type: string
                  description: LCC workspace ID (optional)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
  /api/queue-summary:
    post:
      operationId: getQueueSummary
      summary: Current research and action queue in priority order
      description: What needs to be done, value-ranked, capped to the actionable top-N.
      tags:
        - read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  enum:
                    - government
                    - dialysis
                    - all
                  description: Filter by domain
                status:
                  type: string
                  enum:
                    - pending
                    - in_progress
                    - all
                  description: Filter by status
                limit:
                  type: number
                  description: Max items to return
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
  /api/pipeline-health:
    post:
      operationId: getPipelineHealth
      summary: Status of all data pipelines
      description: Last run times, success rates, and any failures across the LCC data pipelines.
      tags:
        - read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
  /api/recall-memory:
    post:
      operationId: recallMemory
      summary: Recall shared Cortex memory
      description: >-
        Recall decisions, facts, outcomes, and preferences logged across past work sessions. Call at the start of a task
        to stay consistent with prior context. Filter by query/domain/kind.
      tags:
        - read
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: Keyword to match within the memory summary (optional)
                domain:
                  type: string
                  enum:
                    - work
                    - personal
                    - global
                  description: Optional domain filter
                kind:
                  type: string
                  enum:
                    - decision
                    - fact
                    - outcome
                    - preference
                    - note
                  description: Optional kind filter
                limit:
                  type: number
                  description: Max entries (default 20, max 50)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  entries:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/query-comps:
    post:
      operationId: queryComps
      summary: Pull sales comps on demand
      description: >-
        Pull sales comps across the dialysis DB, government DB, and Salesforce-staged comps, normalized to one shape and
        de-duplicated. Cap rates returned as decimals. By default only comps with a reliable NOI/cap are returned; pass
        include_unreliable_noi:true to include modeled-NOI comps.
      tags:
        - comps
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                request:
                  type: string
                  description: Optional natural-language request parsed server-side before explicit fields are applied.
                property_types:
                  type: array
                  items:
                    type: string
                  description: e.g. medical, office, retail, industrial, dialysis, government
                states:
                  type: array
                  items:
                    type: string
                  description: Two-letter state codes
                tenant:
                  type: string
                  description: Single operator/tenant scope, e.g. DaVita, Fresenius.
                tenants:
                  type: array
                  items:
                    type: string
                  description: Multiple operators/tenants.
                include_unreliable_noi:
                  type: boolean
                  description: Also include modeled-NOI / no-NOI comps.
                limit:
                  type: number
                  description: Default 40, max 100.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  comps:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/synthesize-comps:
    post:
      operationId: synthesizeComps
      summary: Assemble one ranked comp set for a request
      description: >-
        Assemble one ranked, de-duplicated comp set from every relevant source for a plain-language request. Returns
        comps scored by relevance, ready for the briggs-comps template.
      tags:
        - comps
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                request:
                  type: string
                  description: The comp request; also routes government intent.
                property_types:
                  type: array
                  items:
                    type: string
                states:
                  type: array
                  items:
                    type: string
                comp_type:
                  type: string
                  enum:
                    - sales
                    - lease
                tenant:
                  type: string
                tenants:
                  type: array
                  items:
                    type: string
                include_unreliable_noi:
                  type: boolean
                limit:
                  type: number
                  description: Default 25, max 50.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  comps:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/comps:
    post:
      operationId: generateComps
      summary: Generate a Briggs CRE comps workbook
      description: >-
        Generate a Briggs CRE comps workbook and return a short-lived download link plus compact counts. One-shot mode:
        pass `request` with the original text; the server synthesizes rows and builds the workbook server-side.
      tags:
        - comps
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                request:
                  type: string
                  description: One-shot workbook mode — pass the comp/appraisal request verbatim.
                comp_type:
                  type: string
                  enum:
                    - sales
                    - lease
                  description: sales = On Market + Sold sheets | lease = Lease Comps sheet
                vertical:
                  type: string
                  description: Set to 'dialysis' for the dialysis sales template (CHAIRS + PATIENTS).
                limit:
                  type: number
                  description: One-shot row target. Default 25, max 50.
                name:
                  type: string
                  description: Label for the filename.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  status:
                    type: string
                  filename:
                    type: string
                  download_url:
                    type: string
  /api/deal/dossier:
    post:
      operationId: getDealDossier
      summary: Read a deal's living context
      description: >-
        Read a deal's living context — the entity snapshot plus its correspondence/activity timeline and milestones.
        Call FIRST when working a specific transaction.
      tags:
        - deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deal:
                  type: string
                  description: Deal name / address / entity id
              required:
                - deal
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
  /api/deal/checkpoints:
    post:
      operationId: listDealCheckpoints
      summary: List a deal's milestone checkpoints
      description: List a deal's milestone checkpoints, flagging overdue / due within N days.
      tags:
        - deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deal:
                  type: string
                within_days:
                  type: number
                  description: default 14
              required:
                - deal
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  checkpoints:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/sf/log-activity:
    post:
      operationId: sfLogActivity
      summary: Log a call/email/meeting on a deal
      description: >-
        Log an interaction in LCC (system of record) and enqueue a link-only pointer to Salesforce. Notes are retained
        in LCC, not synced out. Requires user_confirmed.
      tags:
        - salesforce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deal:
                  type: string
                  description: Property name/address / entity id the activity is on
                subject:
                  type: string
                  description: Activity subject (default "Call")
                note:
                  type: string
                  description: Interaction detail (retained in LCC only)
                activity_type:
                  type: string
                  enum:
                    - Call
                    - Email
                    - Meeting
                  description: default Call
                user_confirmed:
                  type: boolean
                  description: Must be true to execute the write
              required:
                - deal
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  queued:
                    type: boolean
                  lcc_activity_id:
                    type: string
  /api/sf/create-task:
    post:
      operationId: sfCreateTask
      summary: Create a Salesforce task on a deal
      description: Enqueue a Salesforce task on a deal. Requires user_confirmed.
      tags:
        - salesforce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deal:
                  type: string
                  description: Property name/address / entity id the task is on
                subject:
                  type: string
                  description: Task subject
                due_date:
                  type: string
                  description: YYYY-MM-DD (optional)
                assignee_email:
                  type: string
                  description: Assignee email (optional)
                user_confirmed:
                  type: boolean
                  description: Must be true to execute the write
              required:
                - deal
                - subject
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  queued:
                    type: boolean
  /api/sf/update-opportunity:
    post:
      operationId: sfUpdateOpportunity
      summary: Advance a Salesforce Opportunity stage
      description: >-
        Advance an Opportunity stage on a deal (the poller currently supports STAGE advancement — send fields.stage).
        Requires user_confirmed.
      tags:
        - salesforce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deal:
                  type: string
                  description: Property name/address / entity id the opportunity is on
                fields:
                  type: object
                  description: Opportunity fields to set; currently { stage } is supported
                  properties:
                    stage:
                      type: string
                user_confirmed:
                  type: boolean
                  description: Must be true to execute the write
              required:
                - deal
                - fields
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  queued:
                    type: boolean
components:
  schemas: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer LCC_API_KEY
security:
  - bearerAuth: []
