swagger: '2.0'
info:
  title: LCC API (full read + comps surface)
  description: Swagger 2.0 twin of lcc-openapi.yaml for the Microsoft Copilot Studio / Power Platform custom-connector importer (which requires OpenAPI 2.0). The 3.1.0 file remains for ChatGPT. Same host, same routes, same behavior. Cap rates are decimals (0.0745 = 7.45%). READ ops are read-only; the /api/sf/* writes enqueue to sf_sync_queue and require user_confirmed=true (return 428 otherwise).
  version: 2.0.0
host: tranquil-delight-production-633f.up.railway.app
basePath: /
schemes:
- https
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  apiKeyHeader:
    type: apiKey
    in: header
    name: X-LCC-Key
    description: Send your LCC API key as the X-LCC-Key header (raw key, no "Bearer " prefix).
security:
- apiKeyHeader: []
paths:
  /api/search-entities:
    post:
      operationId: searchEntities
      summary: Search properties, contacts, or organizations in LCC.
      description: 'Search the LCC entity graph by name, address, or keyword. Returns matched entities (value-ranked, canonical buyer-parent floated to the top) plus, for org/person matches, the deals where the entity is the tenant or guarantor, and address-like terms also return domain property hits.

        '
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/SearchEntitiesRequest'
      responses:
        '200':
          description: Matched entities + properties.
          schema:
            $ref: '#/definitions/JsonObject'
        '401':
          description: Missing or invalid Bearer token.
  /api/property-context:
    post:
      operationId: getPropertyContext
      summary: Full context for one property.
      description: 'Lease details, ownership history, comps, investment score, research status, related contacts, and the property''s tenant(s) + guarantor(s). Resolve by entity_id or address. Read-only; may warm the shared context-packet cache exactly as the MCP tool does.

        '
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/PropertyContextRequest'
      responses:
        '200':
          description: Property context packet.
          schema:
            $ref: '#/definitions/JsonObject'
        '401':
          description: Missing or invalid Bearer token.
  /api/contact-context:
    post:
      operationId: getContactContext
      summary: Relationship context for a contact.
      description: 'Touchpoint history, active deals, last interaction, days-since-contact, Salesforce id, and an outreach recommendation. Resolve by entity_id, name, or email.

        '
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ContactContextRequest'
      responses:
        '200':
          description: Contact relationship context.
          schema:
            $ref: '#/definitions/JsonObject'
        '401':
          description: Missing or invalid Bearer token.
  /api/ai/daily-briefing:
    post:
      operationId: getDailyBriefing
      summary: Today's strategic / important / urgent priorities.
      description: The team's daily briefing (snapshot when available, else priority-ranked action items).
      parameters:
      - in: body
        name: body
        required: false
        schema:
          $ref: '#/definitions/DailyBriefingRequest'
      responses:
        '200':
          description: Daily briefing.
          schema:
            $ref: '#/definitions/JsonObject'
        '401':
          description: Missing or invalid Bearer token.
  /api/queue-summary:
    post:
      operationId: getQueueSummary
      summary: The current research / action priority queue.
      description: 'The operator''s real, value-ranked priority queue (doctrinal bands, top-N by value) plus band counts and the research-gap universe. Filter by domain / status.

        '
      parameters:
      - in: body
        name: body
        required: false
        schema:
          $ref: '#/definitions/QueueSummaryRequest'
      responses:
        '200':
          description: Priority queue summary + items.
          schema:
            $ref: '#/definitions/JsonObject'
        '401':
          description: Missing or invalid Bearer token.
  /api/pipeline-health:
    post:
      operationId: getPipelineHealth
      summary: Data-pipeline health across domains.
      description: Per-domain last-run / success-rate / failures + open LCC automation alerts. No body required.
      parameters:
      - in: body
        name: body
        required: false
        schema:
          $ref: '#/definitions/EmptyRequest'
      responses:
        '200':
          description: Pipeline health.
          schema:
            $ref: '#/definitions/JsonObject'
        '401':
          description: Missing or invalid Bearer token.
  /api/recall-memory:
    post:
      operationId: recallMemory
      summary: Recall shared Cortex memory (read-only).
      description: 'Recall durable decisions/facts/outcomes/preferences logged across past sessions. Filter by query / domain / kind. (The write counterpart, log_memory, is intentionally NOT exposed over HTTP — it stays Claude/MCP-only.)

        '
      parameters:
      - in: body
        name: body
        required: false
        schema:
          $ref: '#/definitions/RecallMemoryRequest'
      responses:
        '200':
          description: Matching memory entries.
          schema:
            $ref: '#/definitions/JsonObject'
        '401':
          description: Missing or invalid Bearer token.
  /api/query-comps:
    post:
      operationId: queryComps
      summary: Pull sales comps with explicit structured filters.
      description: 'Returns comps matching the given filters, de-duplicated across dialysis, government, and Salesforce sources. By default only comps with a RELIABLE NOI/cap are returned; set include_unreliable_noi to also include modeled/estimated ones. Closed sales are gated to live transactions.

        '
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/QueryCompsRequest'
      responses:
        '200':
          description: Ranked, de-duplicated comp set.
          schema:
            $ref: '#/definitions/CompsResponse'
        '401':
          description: Missing or invalid Bearer token.
  /api/synthesize-comps:
    post:
      operationId: synthesizeComps
      summary: Assemble a ranked comp set from a plain-language request.
      description: 'Parses a natural-language request into structured filters, routes government-only intent away from the dialysis DB, scores by relevance, and returns the ranked set. Pass the raw text as `request`; any explicit field overrides the parsed value.

        '
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/SynthesizeCompsRequest'
      responses:
        '200':
          description: Ranked, relevance-scored comp set.
          schema:
            $ref: '#/definitions/CompsResponse'
        '401':
          description: Missing or invalid Bearer token.
  /api/deal/dossier:
    post:
      operationId: getDealDossier
      summary: Read a deal's dossier — entity snapshot + correspondence/activity + milestones.
      description: 'Returns the deal''s entity snapshot plus its correspondence/activity log and milestone timeline, projected from entities + activity_events. Identify the deal by name, address, or entity id (e.g. "Fresenius Woodland Hills").

        '
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/DealDossierRequest'
      responses:
        '200':
          description: Dossier projection.
          schema:
            $ref: '#/definitions/DealDossier'
        '400':
          description: Missing/unmatched deal.
        '401':
          description: Missing or invalid Bearer token.
        '409':
          description: Ambiguous deal match (candidates returned).
  /api/deal/checkpoints:
    post:
      operationId: listDealCheckpoints
      summary: List a deal's milestone checkpoints, flagging overdue / due-soon.
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/DealCheckpointsRequest'
      responses:
        '200':
          description: Checkpoints.
          schema:
            $ref: '#/definitions/Checkpoints'
        '401':
          description: Missing or invalid Bearer token.
  /api/sf/log-activity:
    post:
      operationId: logSalesforceActivity
      summary: Queue a Salesforce activity/note on a deal (enqueues sf_sync_queue). Requires confirmation.
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/SfLogActivityRequest'
      responses:
        '202':
          description: Queued.
        '400':
          description: Bad request.
        '401':
          description: Missing or invalid Bearer token.
        '409':
          description: Ambiguous deal match.
        '428':
          description: Confirmation required (resend with user_confirmed=true).
  /api/sf/create-task:
    post:
      operationId: createSalesforceTask
      summary: Queue a Salesforce task/follow-up on a deal. Requires confirmation.
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/SfCreateTaskRequest'
      responses:
        '202':
          description: Queued.
        '400':
          description: Bad request.
        '401':
          description: Missing or invalid Bearer token.
        '409':
          description: Ambiguous deal match.
        '428':
          description: Confirmation required.
  /api/sf/update-opportunity:
    post:
      operationId: updateSalesforceOpportunity
      summary: Queue a Salesforce Opportunity field update on a deal. Requires confirmation.
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/SfUpdateOpportunityRequest'
      responses:
        '202':
          description: Queued.
        '400':
          description: Bad request (no fields / disallowed field).
        '401':
          description: Missing or invalid Bearer token.
        '409':
          description: Ambiguous deal match.
        '428':
          description: Confirmation required.
definitions:
  JsonObject:
    type: object
    properties: {}
    additionalProperties: true
    description: The tool's JSON output — identical to the Claude MCP tool of the same name.
  EmptyRequest:
    type: object
    properties: {}
    additionalProperties: false
  SearchEntitiesRequest:
    type: object
    required:
    - query
    properties:
      query:
        type: string
        description: Name, address, or keyword (min 2 chars).
      entity_type:
        type: string
        enum:
        - person
        - organization
        - asset
        description: Optional entity-type filter.
      domain:
        type: string
        enum:
        - government
        - dialysis
        - both
        description: Optional domain filter.
      limit:
        type: number
        description: Max results (default 10, max 50).
  PropertyContextRequest:
    type: object
    properties:
      entity_id:
        type: string
        description: LCC entity UUID.
      address:
        type: string
        description: Property address (alternative to entity_id).
      verbose:
        type: boolean
        description: Return the full context packet. Default false (HTTP responses cap nested arrays and drop raw/document blobs to stay under the Action size limit).
      limit:
        type: number
        description: Per-array cap for nested lists (comps, leases, ownership history, tasks, contacts). Default 8, max 50.
      sections:
        type: array
        items:
          type: string
          enum:
          - entity
          - property
          - active_tasks
          - context_packet
          - tenant_guarantor
          - gov_data
          - dia_data
        description: Optional — return only these top-level sections (entity identity is always retained).
    description: Provide entity_id OR address.
  ContactContextRequest:
    type: object
    properties:
      entity_id:
        type: string
        description: LCC entity UUID.
      name:
        type: string
        description: Contact name (alternative to entity_id).
      email:
        type: string
        description: Email address (alternative to entity_id).
    description: Provide entity_id, name, OR email.
  DailyBriefingRequest:
    type: object
    properties:
      workspace_id:
        type: string
        description: LCC workspace UUID (defaults to the primary workspace).
      limit:
        type: number
        description: Max items per priority band (urgent / high / normal). Default 10, max 50. HTTP responses return display fields only, not the full snapshot.
  QueueSummaryRequest:
    type: object
    properties:
      domain:
        type: string
        enum:
        - government
        - dialysis
        - all
        description: Domain filter.
      status:
        type: string
        enum:
        - pending
        - in_progress
        - all
        description: Status filter.
      limit:
        type: number
        description: Max items (default 25, max 100).
  RecallMemoryRequest:
    type: object
    properties:
      query:
        type: string
        description: Keyword to match within the memory summary.
      domain:
        type: string
        enum:
        - work
        - personal
        - global
      kind:
        type: string
        enum:
        - decision
        - fact
        - outcome
        - preference
        - note
      limit:
        type: number
        description: Max entries (default 20, max 50).
  QueryCompsRequest:
    type: object
    properties:
      comp_type:
        type: string
        enum:
        - sale
        - lease
        - both
        default: sale
      verticals:
        type: array
        items:
          type: string
          enum:
          - government
          - dialysis
        description: Which canonical DBs to query. Omit for both.
      property_types:
        type: array
        items:
          type: string
        description: Plain terms (medical, office, retail, industrial, dialysis, government) expanded to source synonyms.
      states:
        type: array
        items:
          type: string
        description: Two-letter state codes.
      metros:
        type: array
        items:
          type: string
      date_from:
        type: string
        format: date
      date_to:
        type: string
        format: date
      size_min_sf:
        type: number
      size_max_sf:
        type: number
      government_only:
        type: boolean
        description: Restrict to government-tenanted comps (also blocks the dialysis DB).
      include_salesforce:
        type: boolean
        default: true
      include_on_market:
        type: boolean
        default: false
      include_unreliable_noi:
        type: boolean
        default: false
        description: Include modeled/estimated NOI/cap comps (default excludes).
      tenant:
        type: string
        description: Scope to an operator/tenant (e.g. DaVita, Fresenius, US Renal).
      limit:
        type: number
        default: 200
  SynthesizeCompsRequest:
    type: object
    required:
    - request
    properties:
      request:
        type: string
        description: Plain-language comp request.
      comp_type:
        type: string
        enum:
        - sale
        - lease
        - both
      property_types:
        type: array
        items:
          type: string
      states:
        type: array
        items:
          type: string
      metros:
        type: array
        items:
          type: string
      date_from:
        type: string
        format: date
      date_to:
        type: string
        format: date
      size_min_sf:
        type: number
      size_max_sf:
        type: number
      government_only:
        type: boolean
      include_on_market:
        type: boolean
      include_unreliable_noi:
        type: boolean
      limit:
        type: number
  CompsResponse:
    type: object
    properties:
      comps:
        type: array
        items:
          $ref: '#/definitions/Comp'
      meta:
        type: object
        properties:
          returned:
            type: integer
          total_before_cap:
            type: integer
          flagged_for_review:
            type: integer
            description: Count of comps whose cap/rent tripped a reconciliation flag.
          review_flags:
            type: array
            items:
              type: object
              additionalProperties: true
          excluded_unreliable_noi:
            type: integer
          by_source:
            type: object
            additionalProperties:
              type: integer
          warnings:
            type: array
            items:
              type: object
              additionalProperties: true
          interpreted_params:
            type: object
            additionalProperties: true
      markdown:
        type: string
        description: Ready-to-render comps table (the shared format every surface shows).
  Comp:
    type: object
    description: One normalized comp. Cap rates are decimals. Extra fields may be present.
    additionalProperties: true
    properties:
      comp_id:
        type: string
      source:
        type: string
        description: dialysis_db | government_db | salesforce
      vertical:
        type: string
        enum:
        - government
        - dialysis
      tenant:
        type: string
        description: Display name (multi-tenant rendered as "MOB (VA)" / "MT (SSA)").
      agency:
        type: string
      address:
        type: string
      city:
        type: string
      state:
        type: string
      building_sf:
        type: number
      sale_price:
        type: number
      price_withheld:
        type: boolean
      cap_rate:
        type: number
        description: Decimal (0.0745 = 7.45%).
      noi:
        type: number
      annual_rent:
        type: number
      rent_is_imputed:
        type: boolean
      sale_date:
        type: string
        format: date
      chairs:
        type: number
        description: Dialysis only.
      patient_count:
        type: number
        description: Dialysis only.
      review_flags:
        type: array
        items:
          type: string
        description: e.g. cap_mismatch, rent_disagreement, price_over_ask (present only when flagged).
  DealDossierRequest:
    type: object
    required:
    - deal
    properties:
      deal:
        type: string
        description: Deal name, address, or entity id (e.g. Fresenius Woodland Hills).
  DealCheckpointsRequest:
    type: object
    required:
    - deal
    properties:
      deal:
        type: string
        description: Deal name, address, or entity id.
      within_days:
        type: integer
        description: Due-soon window in days (default 14).
  DealDossier:
    type: object
    properties:
      entity_id:
        type: string
      name:
        type: string
      address:
        type: string
      city:
        type: string
      state:
        type: string
      domain:
        type: string
      correspondence:
        type: array
        items:
          type: object
          properties:
            occurred_at:
              type: string
            category:
              type: string
            title:
              type: string
            body:
              type: string
            source_type:
              type: string
            external_url:
              type: string
      milestones:
        type: array
        items:
          type: object
      activity_count:
        type: integer
  Checkpoints:
    type: object
    properties:
      entity_id:
        type: string
      name:
        type: string
      next_checkpoint:
        type: object
        properties:
          milestone:
            type: string
          date:
            type: string
          status:
            type: string
          condition:
            type: string
          flag:
            type: string
            description: overdue | due-soon | pending | met | waived
      checkpoints:
        type: array
        items:
          type: object
  SfLogActivityRequest:
    type: object
    required:
    - deal
    - subject
    - user_confirmed
    properties:
      deal:
        type: string
        description: Deal name/address/entity id.
      subject:
        type: string
      note:
        type: string
      activity_type:
        type: string
        description: Call | Email | Meeting (default Call).
      user_confirmed:
        type: boolean
        description: Must be true — show the resolved deal + change first.
  SfCreateTaskRequest:
    type: object
    required:
    - deal
    - subject
    - user_confirmed
    properties:
      deal:
        type: string
      subject:
        type: string
      due_date:
        type: string
        description: YYYY-MM-DD
      assignee_email:
        type: string
      user_confirmed:
        type: boolean
  SfUpdateOpportunityRequest:
    type: object
    required:
    - deal
    - fields
    - user_confirmed
    properties:
      deal:
        type: string
      fields:
        type: object
        description: 'Whitelisted only: stage, close_date, amount, probability, next_step (confirm SF API names).'
        additionalProperties: true
      user_confirmed:
        type: boolean
